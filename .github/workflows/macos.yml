name: macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag del Release a crear o actualizar (vacío: solo artefacto)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.99.0"
  CARGO_TERM_COLOR: always
  # Apple silicon only: packaging/macos/build.sh defaults to a universal build.
  APEXDESK_ARCHS: aarch64

jobs:
  build:
    name: Build macOS arm64
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
          sudo rm -rf /Library/Developer/CoreSimulator/Caches/* || true
          sudo rm -rf ~/Library/Developer/Xcode/DerivedData/* || true
          rm -rf ~/.cargo/registry/src/*/pdfium-* || true
          df -h /

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: macos-arm64

      - name: Compilar y empaquetar
        run: packaging/macos/build.sh

      - name: Resolver versión y tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag=""
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          fi
          version="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
          dmg="$(basename "$(ls dist/apexdesk-*-macos.dmg)")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "Tag: ${tag:-ninguno} · Versión: $version · $dmg"

      - name: Checksum del DMG
        env:
          DMG: ${{ steps.version.outputs.dmg }}
        run: |
          set -euo pipefail
          ( cd dist && shasum -a 256 "$DMG" > "$DMG.sha256" )
          cat "dist/$DMG.sha256"
          ( cd dist && shasum -a 256 -c "$DMG.sha256" )

      - name: Escribir las notas del Release
        if: steps.version.outputs.tag != ''
        env:
          DMG: ${{ steps.version.outputs.dmg }}
        run: |
          set -euo pipefail
          cat > dist/release-notes.md <<NOTES
          Aplicación para macOS Apple Silicon (arm64), sin firmar ni notarizar: la primera vez
          macOS mostrará el aviso de «desarrollador no identificado».

          ## Instalación

          1. Abre el \`.dmg\` y arrastra **ApexDesk** a *Aplicaciones*.
          2. Clic derecho sobre la app → **Abrir**; o bien:
             \`xattr -dr com.apple.quarantine "/Applications/ApexDesk.app"\`

          ## Verificar la descarga

          \`\`\`sh
          shasum -a 256 -c ${DMG}.sha256
          \`\`\`

          El uso de los binarios oficiales se rige por el [acuerdo de licencia](https://github.com/${GITHUB_REPOSITORY}/blob/main/EULA.md).
          NOTES

      - name: Subir el artefacto
        uses: actions/upload-artifact@v7
        with:
          name: apexdesk-${{ steps.version.outputs.version }}-macos-arm64
          path: |
            dist/*-macos.dmg
            dist/*-macos.dmg.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Publicar el Release
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ApexDesk ${{ steps.version.outputs.version }}
          body_path: dist/release-notes.md
          files: |
            dist/*-macos.dmg
            dist/*-macos.dmg.sha256
          fail_on_unmatched_files: true
